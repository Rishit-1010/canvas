<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Whiteboard – Rishit's Canvas</title>
<link rel="icon" href="favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
<style>
/* Whiteboard – layout follows the 1440×1024 design ("Desktop 4"). */
:root{
  --navy:#000455; --panel:#EDEDED; --track:#D9D9D9;
  --font:'Quicksand','Segoe UI',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#fff;font-family:var(--font);color:var(--navy);
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
svg{display:block}

/* ── Top bar ── */
#topbar{position:fixed;inset:0 0 auto 0;height:60px;background:var(--navy);z-index:60;
  box-shadow:0 2px 2px rgba(0,0,0,.25);display:flex;align-items:center;justify-content:center}
#avatar{position:absolute;left:0;top:0;width:60px;height:60px}
#avatar svg{overflow:visible}
#title{height:25px;display:flex}
#title svg{height:25px;width:auto}
#sidebarBtn{position:absolute;right:10px;top:10px;width:40px;height:40px;border-radius:6px;color:#fff;
  display:flex;align-items:center;justify-content:center}
#sidebarBtn svg{width:22px;height:22px}
#sidebarBtn:hover{background:rgba(255,255,255,.14)}

/* ── Stage ── */
#stage{position:fixed;inset:60px 0 var(--bar-h,84px) 0;overflow:hidden;background:#fff;touch-action:none}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#ted{position:absolute;display:none;background:rgba(255,255,255,.6);border:1px dashed var(--navy);outline:none;
  resize:none;overflow:hidden;white-space:pre;padding:0;margin:0;line-height:1.25;z-index:20;
  -webkit-user-select:text;user-select:text;min-width:20px}
#selbar{position:absolute;z-index:25;display:flex;gap:4px;align-items:center;background:#fff;border-radius:12px;padding:5px;
  box-shadow:0 6px 18px rgba(0,4,85,.28),0 0 0 1px rgba(0,4,85,.08);animation:popIn .16s ease-out}
#selbar[hidden]{display:none}
#selbar button{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:var(--navy);
  transition:background .14s,transform .14s}
#selbar button:hover{background:#EEF0FF;transform:translateY(-1px)}#selbar button:active{transform:scale(.92)}
#selbar button svg{width:20px;height:20px}
#selColor span{width:20px;height:20px;border-radius:50%;box-shadow:0 0 0 2px #fff,0 0 0 3px rgba(0,4,85,.45);display:block}


/* ── Bottom bar: tools + controls in one fixed navy bar (like the top bar) ── */
#bbar{position:fixed;inset:auto 0 0 0;z-index:60;background:var(--navy);box-shadow:0 -2px 2px rgba(0,0,0,.25);
  display:flex;align-items:center;justify-content:space-between;gap:14px;padding:8px 14px calc(8px + env(safe-area-inset-bottom));--tw:56px}
#tools{display:flex;gap:6px;padding:6px 4px 4px;margin:-6px 0 -4px;overflow-x:auto;scrollbar-width:none;min-width:0}
#tools::-webkit-scrollbar{display:none}
#ctrl{display:flex;align-items:center;gap:10px;flex:none}
.tool{width:var(--tw);height:calc(var(--tw)*65/60);border-radius:5px;background:#fff;border:.5px solid #fff;color:var(--navy);flex:none;
  display:block;position:relative;padding:0}
.tool svg{position:absolute;inset:0;width:100%;height:100%}
.tool .rw{display:none}
.tool.active{background:var(--navy);color:#fff;border-color:#fff;box-shadow:0 0 0 2px #fff;transform:translateY(-3px)}
.tool.active .rn{display:none}
.tool.active .rw{display:inline}
.tool{transition:transform .16s cubic-bezier(.2,.8,.3,1),box-shadow .16s,background .16s}
.tool:not(.active):hover{background:#EEF0FF;transform:translateY(-3px);box-shadow:0 4px 10px rgba(0,0,0,.35)}
.tool:active{transform:scale(.96)}
.tool.open:not(.active){background:#DDE1FF}
.tool:focus-visible{outline:2px solid #6ea8ff;outline-offset:2px}
.cg{height:calc(var(--tw)*65/60);background:var(--panel);border-radius:10px;display:flex;align-items:center;gap:8px;padding:0 10px;flex:none}
.bb{background:#fff;border:.5px solid var(--navy);border-radius:4.75px;color:var(--navy);padding:0;display:flex;
  align-items:center;justify-content:center;flex:none;width:36px;height:36px}
.bb svg{width:100%;height:100%}
#undoBtn svg,#redoBtn svg{width:20px;height:20px}
.bb.flat{background:none;border:0;width:26px;height:26px}
.bb:hover:not(:disabled){background:#EEF0FF}.bb.flat:hover:not(:disabled){background:rgba(0,4,85,.08)}
.bb:disabled{opacity:.35;cursor:default}
#prevBtn,#nextBtn{width:20px;height:32px}
#prevBtn svg,#nextBtn svg{width:8px;height:18px}
.lbl{display:block;color:var(--navy);white-space:nowrap}
.lbl svg{width:auto;height:14px}
.lbl.txt{font:500 18px/1 var(--font)}
#pageNum{width:30px;height:24px;font:500 18px/1 var(--font);text-align:center;-webkit-user-select:text;user-select:text;outline:none}
#pageNum:focus{box-shadow:0 0 0 2px rgba(0,4,85,.35)}
#zoomRange{-webkit-appearance:none;appearance:none;width:120px;height:14px;background:transparent;cursor:pointer;--p:38%}
#zoomRange::-webkit-slider-runnable-track{height:6px;border-radius:3px;
  background:linear-gradient(to right,var(--navy) var(--p),var(--track) var(--p))}
#zoomRange::-moz-range-track{height:6px;border-radius:3px;background:var(--track)}
#zoomRange::-moz-range-progress{height:6px;border-radius:3px;background:var(--navy)}
#zoomRange::-webkit-slider-thumb{-webkit-appearance:none;width:14px;height:14px;border-radius:50%;background:var(--navy);margin-top:-4px}
#zoomRange::-moz-range-thumb{width:14px;height:14px;border:0;border-radius:50%;background:var(--navy)}
#zoomPct{display:none;font:700 14px var(--font);min-width:48px;height:30px;border-radius:6px;color:var(--navy)}
/* medium screens: controls on top, tools below */
@media (max-width:1299px){
  #bbar{flex-direction:column-reverse;align-items:stretch;gap:8px;--tw:58px}
  #tools{justify-content:center}
  #ctrl{justify-content:center;flex-wrap:nowrap}
  .cg{height:48px}
}
@media (max-width:760px){
  #bbar{--tw:50px;padding-left:8px;padding-right:8px;gap:6px}
  #ctrl{gap:6px}.cg{gap:6px;padding:0 8px;height:44px}
  #zoomRange{width:84px}.bb{width:32px;height:32px}.lbl svg{height:12px}
  #tools{justify-content:flex-start}
}
@media (max-width:560px){
  #bbar{--tw:48px}
  #zoomRange,.lbl:not(.txt),#zoomOutBtn,#zoomInBtn{display:none}
  #zoomPct{display:block}
  #ctrl{justify-content:space-between;width:100%}
  #g2{gap:4px}
}
@media (max-width:380px){ #bbar{--tw:44px} .cg{padding:0 5px;gap:4px} .bb{width:28px;height:28px} #pageNum{width:26px} }
@media (max-height:520px) and (min-width:561px){ #bbar{--tw:44px} }

/* ── Option popover ── */
@keyframes popUp{from{opacity:0;transform:translateY(10px) scale(.95)}to{opacity:1;transform:none}}
@keyframes popIn{from{opacity:0;transform:translateX(-8px) scale(.95)}to{opacity:1;transform:none}}
@keyframes fadeUp{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
#pop{position:fixed;z-index:55;width:252px;max-height:calc(100vh - 150px);overflow-y:auto;overscroll-behavior:contain;padding:14px 14px 12px;border-radius:18px;font-size:13px;font-weight:600;color:var(--navy);
  background:rgba(250,250,255,.97);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(0,4,85,.1);
  box-shadow:0 22px 44px -10px rgba(0,4,85,.4),0 2px 8px rgba(0,4,85,.12);transform-origin:50% 100%;animation:popUp .22s cubic-bezier(.2,.9,.3,1.15)}
#pop[hidden]{display:none}
#pop.wide{width:340px;max-width:calc(100vw - 12px)}
#pop::-webkit-scrollbar{width:8px}#pop::-webkit-scrollbar-thumb{background:rgba(0,4,85,.25);border-radius:4px}
#pop .ph{margin:-2px 0 12px;padding-bottom:10px;border-bottom:1px solid rgba(0,4,85,.1);display:flex;flex-direction:column;gap:1px}
#pop .ph b{font-size:17px;font-weight:700;letter-spacing:.01em}
#pop .ph span{font-size:11.5px;font-weight:500;opacity:.6}
#pop h3{font-size:10.5px;font-weight:700;margin:0 0 7px;letter-spacing:.1em;text-transform:uppercase;opacity:.55}
#pop .sec{margin-bottom:13px}#pop .sec:last-child{margin-bottom:0}
#pop .sw{display:flex;flex-wrap:wrap;gap:8px}
.dot{width:26px;height:26px;border-radius:50%;background:var(--c);position:relative;flex:none;border:2px solid #fff;
  box-shadow:0 0 0 1px rgba(0,0,0,.2);transition:transform .15s cubic-bezier(.2,.8,.3,1.4),box-shadow .15s}
.dot:hover{transform:scale(1.2)}
.dot.on{box-shadow:0 0 0 2.5px var(--navy);transform:scale(1.08)}
.dot.rainbow{background:conic-gradient(#f44,#fc3,#4d4,#3cf,#74f,#f4c,#f44);box-shadow:0 0 0 1px rgba(0,0,0,.2)}
.dot.rainbow i{position:absolute;inset:6px;border-radius:50%;background:#fff;box-shadow:0 0 0 1.5px #fff}
.dot.rainbow.on{box-shadow:0 0 0 2.5px var(--navy)}
#pop .chips{display:flex;flex-wrap:wrap;gap:6px}
#pop .grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px}#pop .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}#pop .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:6px}
.chip{min-height:34px;padding:0 11px;border-radius:10px;background:#fff;border:1px solid rgba(0,4,85,.16);color:var(--navy);
  display:flex;align-items:center;justify-content:center;gap:6px;font-size:12.5px;font-weight:700;line-height:1.15;text-align:center;
  transition:transform .15s cubic-bezier(.2,.8,.3,1.3),background .15s,color .15s,box-shadow .15s,border-color .15s}
.chip:hover{transform:translateY(-2px);border-color:var(--navy);box-shadow:0 6px 12px -4px rgba(0,4,85,.35)}
.chip:active{transform:scale(.96)}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy);box-shadow:0 6px 14px -4px rgba(0,4,85,.6)}
.chip.icon{padding:0;height:42px}.chip svg{width:24px;height:24px;flex:none}
.chip.tall{flex-direction:column;height:62px;gap:3px;font-size:12px}.chip.tall svg{width:26px;height:26px}
.chip.dash{width:68px;padding:0}.chip.dash svg{width:44px;height:10px}
#pop .tl .chip{justify-content:flex-start;text-align:left;padding:7px 10px;font-size:12px;min-height:36px}
#pop .more{max-height:0;overflow:hidden;opacity:0;transition:max-height .28s ease,opacity .2s,margin .2s}
#pop .more.open{max-height:130px;opacity:1;margin-top:8px}
#pop .more .grid4{margin-bottom:0}
#pop .morebtn{margin-top:2px;padding:4px 2px;font-size:12px;font-weight:700;color:var(--navy);opacity:.75;transition:opacity .15s,transform .15s}
#pop .morebtn::after{content:' ▾'}#pop .morebtn:hover{opacity:1;transform:translateX(2px)}
#pop .row{display:flex;align-items:center;gap:10px}
#pop .row b{min-width:46px;text-align:center;font-weight:700;font-size:12px;background:#fff;border:1px solid rgba(0,4,85,.14);border-radius:8px;padding:3px 0}
#pop input[type=range],#cp input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:20px;background:transparent;cursor:pointer;--p:50%}
#pop input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:linear-gradient(to right,var(--navy) var(--p),rgba(0,4,85,.15) var(--p))}
#pop input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:rgba(0,4,85,.15)}
#pop input[type=range]::-moz-range-progress{height:6px;border-radius:3px;background:var(--navy)}
#pop input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:#fff;border:3.5px solid var(--navy);margin-top:-6px;transition:transform .15s,box-shadow .15s;box-shadow:0 2px 5px rgba(0,4,85,.3)}
#pop input[type=range]::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:#fff;border:3.5px solid var(--navy)}
#pop input[type=range]:hover::-webkit-slider-thumb{transform:scale(1.18);box-shadow:0 0 0 6px rgba(0,4,85,.12)}
#pop .prev{height:62px;border-radius:12px;background:#fff;border:1px solid rgba(0,4,85,.1);margin-bottom:13px;display:flex;align-items:center;justify-content:center;overflow:hidden;
  background-image:linear-gradient(45deg,#f1f2f8 25%,transparent 25%,transparent 75%,#f1f2f8 75%),linear-gradient(45deg,#f1f2f8 25%,transparent 25%,transparent 75%,#f1f2f8 75%);background-size:12px 12px;background-position:0 0,6px 6px}
#pop .prev.small{height:38px;margin:13px 0 0}#pop .prev svg{width:100%;height:100%}
#pop .prev.tx{font-weight:600;white-space:nowrap}
#pop .eprev{height:112px;border-radius:12px;background:#fff;border:1px solid rgba(0,4,85,.1);margin-bottom:13px;display:flex;align-items:center;justify-content:center;overflow:hidden}
#pop .eprev i{display:block;border-radius:50%;border:2px solid var(--navy);background:rgba(0,4,85,.07);transition:width .1s,height .1s}
#pop p.hint{font-size:11.5px;font-weight:500;line-height:1.45;margin-top:12px;padding:8px 10px;border-radius:10px;background:rgba(0,4,85,.05);color:rgba(0,4,85,.85)}

/* ── Colour picker ── */
#cp{position:fixed;z-index:80;width:244px;padding:12px;border-radius:18px;background:#fff;border:1px solid rgba(0,4,85,.1);
  box-shadow:0 24px 50px -10px rgba(0,4,85,.45),0 2px 8px rgba(0,4,85,.14);touch-action:none}
#cp[hidden]{display:none}#cp.in{animation:popIn .18s cubic-bezier(.2,.9,.3,1.15)}
.cp-sv{position:relative;height:158px;border-radius:12px;cursor:crosshair;touch-action:none;
  background:linear-gradient(to top,#000,transparent),linear-gradient(to right,#fff,hsl(var(--h,0),100%,50%))}
.cp-hue{position:relative;height:14px;margin:14px 2px 14px;border-radius:7px;cursor:pointer;touch-action:none;background:linear-gradient(to right,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00)}
.cp-sv i,.cp-hue i{position:absolute;width:18px;height:18px;border-radius:50%;border:3px solid #fff;transform:translate(-50%,-50%);box-shadow:0 1px 5px rgba(0,0,0,.55);pointer-events:none;transition:transform .12s}
.cp-hue i{top:50%}.cp-sv:active i,.cp-hue:active i{transform:translate(-50%,-50%) scale(1.15)}
.cp-row{display:flex;gap:8px;align-items:center}
.cp-prev{width:36px;height:36px;border-radius:10px;flex:none;box-shadow:inset 0 0 0 1px rgba(0,0,0,.18)}
.cp-field{flex:1;display:flex;align-items:center;height:36px;border:1px solid rgba(0,4,85,.2);border-radius:10px;padding:0 10px;gap:4px;transition:border-color .15s,box-shadow .15s}
.cp-field:focus-within{border-color:var(--navy);box-shadow:0 0 0 3px rgba(0,4,85,.12)}
.cp-field b{opacity:.5;font-weight:700}
.cp-hex{width:100%;border:0;outline:0;background:transparent;font:700 14px 'Courier New',monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--navy);-webkit-user-select:text;user-select:text}
.cp-eye{width:36px;height:36px;border-radius:10px;border:1px solid rgba(0,4,85,.2);color:var(--navy);display:flex;align-items:center;justify-content:center;transition:background .15s,transform .15s}
.cp-eye[hidden]{display:none}.cp-eye:hover{background:#EEF0FF;transform:translateY(-1px)}.cp-eye svg{width:18px;height:18px}

/* ── Geometry hint pill ── */
#hint{position:fixed;left:50%;top:74px;transform:translateX(-50%);z-index:56;max-width:min(92vw,560px);text-align:center;pointer-events:none;
  background:var(--navy);color:#fff;font-weight:700;font-size:13px;padding:8px 18px;border-radius:20px;box-shadow:0 8px 20px rgba(0,4,85,.35);animation:fadeUp .2s ease-out}
#hint[hidden]{display:none}
/* ── Sidebar ── */
#scrim{position:fixed;inset:60px 0 0 0;background:rgba(0,0,0,.25);z-index:70}
#scrim[hidden]{display:none}
#sidebar{position:fixed;top:60px;right:0;bottom:0;width:260px;background:#fff;z-index:75;padding:12px 0;
  box-shadow:-4px 0 14px rgba(0,0,0,.2);transform:translateX(105%);transition:transform .22s ease;overflow:auto}
#sidebar.open{transform:none}
#sidebar h2{font-size:12px;letter-spacing:.06em;text-transform:uppercase;padding:14px 18px 6px;opacity:.7}
#sidebar .nav{display:block;width:100%;text-align:left;padding:13px 18px;font:700 16px var(--font);color:var(--navy);text-decoration:none}
#sidebar .nav:hover{background:#EEF0FF}
#sidebar .nav.current{background:var(--navy);color:#fff}
#sidebar .nav.disabled{opacity:.5;cursor:not-allowed}
#sidebar .nav small{font-weight:500;font-size:11px;margin-left:6px}

/* ── Modal & toast ── */
#modal{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:90;display:flex;align-items:center;justify-content:center}
#modal[hidden]{display:none}
#modal .box{background:#fff;border-radius:12px;padding:22px;max-width:340px;width:calc(100% - 32px);box-shadow:0 8px 30px rgba(0,0,0,.3)}
#modal p{font-size:16px;font-weight:700;margin-bottom:16px}
#modal .row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
#modal button{height:38px;padding:0 16px;border-radius:6px;border:.5px solid var(--navy);background:#fff;font-weight:700}
#modal button.primary{background:var(--navy);color:#fff}
#toast{position:fixed;left:50%;bottom:calc(var(--bar-h,84px) + 16px);transform:translateX(-50%);background:rgba(0,4,85,.92);color:#fff;
  padding:7px 14px;border-radius:16px;font-size:13px;font-weight:700;z-index:95;pointer-events:none}
#toast[hidden]{display:none}

/* ── Hover & motion polish ── */
#avatar{transition:transform .2s cubic-bezier(.2,.8,.3,1.4)}#avatar:hover{transform:scale(1.08)}
#sidebarBtn{transition:background .15s,transform .15s}#sidebarBtn:active{transform:scale(.92)}
.bb{transition:transform .15s cubic-bezier(.2,.8,.3,1.3),background .15s,box-shadow .15s,opacity .15s}
.bb:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 3px 8px rgba(0,4,85,.22)}
.bb.flat:hover:not(:disabled){transform:scale(1.14);box-shadow:none}
.bb:active:not(:disabled){transform:scale(.93)}
#delBtn:hover:not(:disabled){color:#c62828;background:rgba(198,40,40,.1)}
#sidebar .nav{transition:background .15s,padding-left .18s,color .15s}
#sidebar .nav:not(.disabled):not(.current):hover{padding-left:26px;background:#EEF0FF}
#modal .box{animation:popIn .18s cubic-bezier(.2,.9,.3,1.15)}
#modal button{transition:transform .15s,box-shadow .15s,background .15s}
#modal button:hover{transform:translateY(-1px);box-shadow:0 4px 10px rgba(0,4,85,.25)}
#modal button.primary:hover{background:#0a0f7a}
#modal input.num{flex:1;min-width:90px;height:38px;border:1px solid rgba(0,4,85,.3);border-radius:8px;padding:0 10px;font:700 15px var(--font);color:var(--navy);outline:0;-webkit-user-select:text;user-select:text}
#modal input.num:focus{border-color:var(--navy);box-shadow:0 0 0 3px rgba(0,4,85,.14)}
#toast{animation:fadeUp .18s ease-out}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

</style>
</head>
<body>

<header id="topbar">

function delSel() { if (!sel.size) return; action(() => { const ids = geo.withDependents([...sel]); B().objs = objs().filter(o => !ids.has(o.id)); sel.clear(); }); syncUI(); }
function copySel() { clip = structuredClone(selObjs().filter(o => o.type !== 'geo')); }
function pasteClip(off = 24) {
  if (!clip.length) return; const c = structuredClone(clip).map(o => { o.id = uid(); moveObj(o, off, off); return o; });
  action(() => objs().push(...c)); clip = structuredClone(c); setTool('select'); sel = new Set(c.map(o => o.id)); syncUI();
}
function dupSel() { if (sel.size) { copySel(); pasteClip(); } }

/* ───────── Zoom ───────── */
const zr = $('#zoomRange');
const z2p = z => z <= 1 ? (z - MIN_Z) / (1 - MIN_Z) * .38 : .38 + (z - 1) / (MAX_Z - 1) * .62;
const p2z = p => p <= .38 ? MIN_Z + (p / .38) * (1 - MIN_Z) : 1 + (p - .38) / .62 * (MAX_Z - 1);
function zoomAt(nz, sx, sy) {
  const v = view(); nz = clamp(nz, MIN_Z, MAX_Z); const wx = (sx - v.x) / v.z, wy = (sy - v.y) / v.z;
  v.z = nz; v.x = sx - wx * nz; v.y = sy - wy * nz; syncZoom(); dirty();
}
function syncZoom() { const p = z2p(view().z); zr.value = Math.round(p * 1000); zr.style.setProperty('--p', p * 100 + '%'); $('#zoomPct').textContent = Math.round(view().z * 100) + '%'; toast(Math.round(view().z * 100) + '%'); }
zr.addEventListener('input', () => zoomAt(p2z(zr.value / 1000), W / 2, H / 2));
$('#zoomPct').addEventListener('click', () => zoomAt(1, W / 2, H / 2));
$('#zoomInBtn').addEventListener('click', () => zoomAt(view().z * 1.25, W / 2, H / 2));
$('#zoomOutBtn').addEventListener('click', () => zoomAt(view().z / 1.25, W / 2, H / 2));
let toastT; function toast(msg, ms = 900) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, ms); }

/* ───────── Boards ───────── */
const pageNum = $('#pageNum');
function goBoard(i) {
  geo.cancel(); i = clamp(i, 0, boards.length - 1); closeEditor(true); cancelDrag(); cur = i; sel.clear(); pageSync(); syncZoom(); toast('Board ' + (i + 1) + ' of ' + boards.length); syncUI(); dirty(); save();
}
function pageSync() { $('#delBtn').disabled = boards.length < 2; pageNum.value = cur + 1; $('#pageOf').textContent = 'of ' + boards.length; $('#prevBtn').disabled = cur === 0; $('#nextBtn').disabled = cur === boards.length - 1; if (popFor === 'backdrop' || popFor === 'tools') renderPop(); }
$('#prevBtn').addEventListener('click', () => goBoard(cur - 1));
$('#nextBtn').addEventListener('click', () => goBoard(cur + 1));
$('#delBtn').addEventListener('click', () => { if (boards.length < 2) return; modal('Delete board ' + (cur + 1) + ' of ' + boards.length + '? This cannot be undone.', [['Cancel'], ['Delete board', () => { boards.splice(cur, 1); goBoard(Math.min(cur, boards.length - 1)); }, true]]); });
$('#addBtn').addEventListener('click', () => { boards.splice(cur + 1, 0, newBoard()); goBoard(cur + 1); });
pageNum.addEventListener('keydown', e => { e.stopPropagation(); if (e.key === 'Enter') { const n = parseInt(pageNum.value, 10); goBoard(isNaN(n) ? cur : n - 1); pageNum.blur(); } if (e.key === 'Escape') { pageSync(); pageNum.blur(); } });
pageNum.addEventListener('blur', () => { const n = parseInt(pageNum.value, 10); if (!isNaN(n) && n - 1 !== cur) goBoard(n - 1); else pageSync(); });
pageNum.addEventListener('focus', () => pageNum.select());
$('#undoBtn').addEventListener('click', undo); $('#redoBtn').addEventListener('click', redo);
function syncUI() { $('#undoBtn').disabled = !B().undo.length; $('#redoBtn').disabled = !B().redo.length; }

/* ───────── Modal / clear ───────── */
function modal(msg, buttons) {
  $('#modalMsg').textContent = msg; const row = $('#modalBtns'); row.replaceChildren();
  buttons.forEach(([label, fn, primary]) => row.append(h('button', { class: primary ? 'primary' : '', on: { click: () => { $('#modal').hidden = true; fn && fn(); } } }, [label])));
  $('#modal').hidden = false; row.lastChild.focus();
}
function askClear() {
  const btns = [['Cancel'], ];
  if (boards.length > 1) btns.push(['Delete board', () => { boards.splice(cur, 1); goBoard(Math.min(cur, boards.length - 1)); }]);
  btns.push(['Clear board', () => { action(() => { B().objs = []; sel.clear(); }); }, true]);
  modal('Clear everything on this board?', btns);
}
let onModalCancel = null;
const closeModal = () => { $('#modal').hidden = true; if (onModalCancel) { const f = onModalCancel; onModalCancel = null; f(); } };
$('#modal').addEventListener('pointerdown', e => { if (e.target.id === 'modal') closeModal(); });
function askNumber(spec, cb) {
  $('#modalMsg').textContent = spec.msg; const row = $('#modalBtns'); row.replaceChildren();
  const inp = h('input', { type: 'number', value: spec.def, step: spec.int ? 1 : 'any', class: 'num' });
  const ok = () => { let v = parseFloat(inp.value); if (isNaN(v)) return; if (spec.int) v = Math.round(v); if (spec.min != null && v < spec.min) v = spec.min; onModalCancel = null; $('#modal').hidden = true; cb(v); };
  inp.addEventListener('keydown', e => { e.stopPropagation(); if (e.key === 'Enter') ok(); if (e.key === 'Escape') closeModal(); });
  row.append(inp, h('button', { on: { click: closeModal } }, ['Cancel']), h('button', { class: 'primary', on: { click: ok } }, ['OK']));
  onModalCancel = () => cb(null); $('#modal').hidden = false; inp.focus(); inp.select();
}
function geoChanged() {
  const hint = $('#hint'), on = tool === 'tools' && geo.state.tool; hint.hidden = !on; if (on) hint.textContent = geo.hintText();
  updateCursor(); dirty();
}

/* ───────── Sidebar ───────── */
const sidebar = $('#sidebar'), scrim = $('#scrim');
function toggleSidebar(open) { open = open ?? !sidebar.classList.contains('open'); sidebar.classList.toggle('open', open); scrim.hidden = !open; }
$('#sidebarBtn').addEventListener('click', () => toggleSidebar()); scrim.addEventListener('click', () => toggleSidebar(false));
sidebar.querySelector('.disabled').addEventListener('click', e => { e.preventDefault(); toast('Graph calculator is coming soon', 1600); });
$('#exportPng').addEventListener('click', () => { exportPng(); toggleSidebar(false); });
$('#saveJson').addEventListener('click', () => { download(new Blob([JSON.stringify(serialize())], { type: 'application/json' }), 'board.json'); toggleSidebar(false); });
$('#openJson').addEventListener('click', () => $('#fileJson').click());
$('#fileJson').addEventListener('change', e => { const f = e.target.files[0]; if (!f) return; f.text().then(t => { try { load(JSON.parse(t)); toggleSidebar(false); toast('Board file opened'); } catch (er) { toast('Not a valid board file', 1800); } }); e.target.value = ''; });
function download(blob, name) { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 3000); }
function exportPng() {
  const b = B(), box = unionBox(b.objs) || { x: 0, y: 0, w: W, h: H }, pad = 40, k = 2;
  const c = document.createElement('canvas'); c.width = (box.w + pad * 2) * k; c.height = (box.h + pad * 2) * k; const x = c.getContext('2d');
  const v = { x: -box.x + pad, y: -box.y + pad, z: 1 };
  x.setTransform(k, 0, 0, k, 0, 0); drawBackdrop(x, v, box.w + pad * 2, box.h + pad * 2, b.bg);
  x.setTransform(k, 0, 0, k, v.x * k, v.y * k); b.objs.forEach(o => drawObj(x, o, 1));
  c.toBlob(bl => download(bl, 'whiteboard.png'));
}

/* ───────── Persistence ───────── */
function serialize() {
  const used = new Set(); boards.forEach(b => { b.objs.forEach(o => o.img && used.add(o.img)); if (b.bg.img) used.add(b.bg.img); });
  const im = {}; used.forEach(id => { if (imgs.get(id)) im[id] = imgs.get(id).src; });
  return { v: 1, cur, imgs: im, boards: boards.map(b => ({ id: b.id, objs: b.objs, bg: b.bg, view: b.view })) };
}
function load(d) {
  imgs.clear(); for (const [id, src] of Object.entries(d.imgs || {})) { const el = new Image(); el.onload = dirty; el.src = src; imgs.set(id, { src, el }); }
  boards = d.boards.map(b => ({ ...newBoard(), ...b, undo: [], redo: [], inst: [] })); if (!boards.length) boards = [newBoard()];
  boards.forEach(b => b.objs.forEach(o => { if (o.type === 'text') measure(o); }));
  cur = clamp(d.cur || 0, 0, boards.length - 1); sel.clear(); pageSync(); syncZoom(); syncUI(); dirty();
}
let saveT, warned = false;
function save() {
  clearTimeout(saveT);
  saveT = setTimeout(() => { try { localStorage.setItem('rmcanvas.wb.v1', JSON.stringify(serialize())); } catch (e) { if (!warned) { warned = true; toast('Could not autosave (browser storage is full)', 2500); } } }, 500);
}

/* ───────── Keyboard ───────── */
window.addEventListener('keydown', e => {
  if (/input|textarea|select/i.test(e.target.tagName) && e.target.type !== 'range') return;
  const k = e.key.toLowerCase(), mod = e.ctrlKey || e.metaKey;
  if (!$('#modal').hidden) { if (k === 'escape') $('#modal').hidden = true; return; }
  if (k === ' ' && !spaceDown) { spaceDown = true; cv.style.cursor = 'grab'; e.preventDefault(); return; }
  if (mod && k === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); return; }
  if (mod && k === 'y') { e.preventDefault(); redo(); return; }
  if (mod && k === 'a') { e.preventDefault(); setTool('select'); sel = new Set(objs().map(o => o.id)); dirty(); return; }
  if (mod && k === 'c') { copySel(); return; } if (mod && k === 'x') { copySel(); delSel(); return; }
  if (mod && k === 'd') { e.preventDefault(); dupSel(); return; }
  if (mod) return;
  if (k === 'delete' || k === 'backspace') { e.preventDefault(); delSel(); return; }
  if (k === 'escape') { sel.clear(); geo.cancel(); closePop(); toggleSidebar(false); dirty(); return; }
  if (k === 'enter' && tool === 'tools' && geo.state.tool) { geo.finish(); return; }
  if (k.startsWith('arrow') && sel.size) {
    e.preventDefault(); const st = e.shiftKey ? 10 : 1, dx = k === 'arrowleft' ? -st : k === 'arrowright' ? st : 0, dy = k === 'arrowup' ? -st : k === 'arrowdown' ? st : 0;
    action(() => geo.moveMany(selObjs(), dx, dy, moveObj)); return;
  }
  const map = { v: 'select', h: 'move', p: 'pen', e: 'eraser', s: 'shapes', t: 'text' };
  if (map[k]) { closePop(); setTool(map[k]); }
});
window.addEventListener('keyup', e => { if (e.key === ' ') { spaceDown = false; updateCursor(); } });

/* ───────── Init ───────── */
(function init() {
  try { const d = JSON.parse(localStorage.getItem('rmcanvas.wb.v1')); if (d && d.boards) load(d); } catch (e) { }
  resize(); pageSync(); syncUI(); syncZoom(); $('#toast').hidden = true; updateCursor();
  if (document.fonts) document.fonts.ready.then(() => { boards.forEach(b => b.objs.forEach(o => o.type === 'text' && measure(o))); dirty(); });
  // test hook
  window.__wb = { geo, get boards() { return boards; }, get tool() { return tool; }, get sel() { return sel; }, S };
})();
})();

</script>
