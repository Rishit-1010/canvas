<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Rishit's Canvas</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">

  <!-- Google Fonts: UI fonts, the logo fonts and every font offered by the Text tool -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anta&family=Anton&family=Bebas+Neue&family=Caveat&family=Dancing+Script&family=Figtree:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Lato&family=Lobster&family=Manufacturing+Consent&family=Merriweather&family=Montserrat&family=Oswald&family=Pacifico&family=Parkinsans&family=Playfair+Display&family=Poppins&family=Quicksand:wght@400;500;600;700&family=Raleway&family=Roboto&family=Roboto+Mono&family=Space+Grotesk&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ===================== MAIN SIDEBAR ===================== -->
  <div id="scrim"></div>
  <aside id="sidebar" aria-label="Main menu">
    <header class="sb-head">
      <!-- The logo (same artwork as logo.svg, inlined so it can use the page's Google fonts) -->
      <svg class="logo" viewBox="140 290 2070 670" role="img" aria-label="Rishit's Canvas">
        <defs>
          <mask id="penCutInline" maskUnits="userSpaceOnUse" x="0" y="0" width="2400" height="1260">
            <rect width="2400" height="1260" fill="#fff"/>
            <path d="M505 580 L503 676 Q503 684 511 680 L592 641 Q597 638 601 632 L765 388 Q772 378 764 370 L712 332 Q696 318 684 331 L509 574 Q505 578 505 580 Z" fill="#000" stroke="#000" stroke-width="56" stroke-linejoin="round"/>
          </mask>
        </defs>
        <g fill="none" stroke="#000455" stroke-linecap="round" stroke-linejoin="round">
          <rect x="173" y="410" width="596" height="520" rx="48" stroke-width="32" mask="url(#penCutInline)"/>
          <path d="M505 580 L503 676 Q503 684 511 680 L592 641 Q597 638 601 632 L765 388 Q772 378 764 370 L712 332 Q696 318 684 331 L509 574 Q505 578 505 580 Z" stroke-width="24"/>
        </g>
        <path fill="#000455" d="M222 676 C250 640 290 628 335 645 C380 662 400 700 440 712 C468 718 490 700 498 684 C484 696 465 710 436 720 C396 724 372 690 334 668 C294 646 254 650 222 676 Z"/>
        <text x="885" y="660" font-family="'Manufacturing Consent', serif" font-size="430" fill="#000455" textLength="1305" lengthAdjust="spacingAndGlyphs">Rishit’s</text>
        <text x="915" y="897" font-family="'Anta', sans-serif" font-size="185" fill="#000455" textLength="1235" lengthAdjust="spacing">CANVAS</text>
      </svg>
      <button id="sbClose" class="icon-btn" data-icon="panel" title="Close menu" aria-label="Close menu"></button>
    </header>

    <nav class="sb-body">
      <p class="sb-label">Workspaces</p>
      <button class="sb-item active" data-workspace="whiteboard">
        <span class="ico" data-icon="pencil"></span>
        <span class="txt"><b>Whiteboard</b><small>Draw, write &amp; construct</small></span>
      </button>
      <button class="sb-item" data-workspace="graph">
        <span class="ico" data-icon="chart"></span>
        <span class="txt"><b>Graph Calculator</b><small>Plot, solve &amp; explore</small></span>
      </button>

      <p class="sb-label">Board</p>
      <button class="sb-item" data-action="export-png">
        <span class="ico" data-icon="image"></span>
        <span class="txt"><b>Export as PNG</b><small>Save the board as an image</small></span>
      </button>
      <button class="sb-item" data-action="save-file">
        <span class="ico" data-icon="download"></span>
        <span class="txt"><b>Save board file</b><small>Download all boards (.json)</small></span>
      </button>
      <button class="sb-item" data-action="open-file">
        <span class="ico" data-icon="folder"></span>
        <span class="txt"><b>Open board file</b><small>Load a saved board</small></span>
      </button>
      <input type="file" id="fileInput" accept=".json,application/json" hidden>
    </nav>
  </aside>

  <!-- ===================== WHITEBOARD WORKSPACE ===================== -->
  <main id="ws-whiteboard" class="workspace active">
    <!-- three stacked canvases: backdrop, drawing, and a live overlay for previews -->
    <canvas id="bgCanvas"></canvas>
    <canvas id="drawCanvas"></canvas>
    <canvas id="overlayCanvas"></canvas>

    <div id="instruments"></div>   <!-- ruler, compass, set squares, protractor -->
    <div id="textLayer"></div>     <!-- on-canvas text editor -->

    <button class="float-btn" data-open-sidebar data-icon="panel" title="Menu" aria-label="Open menu"></button>

    <div id="zoomBadge" aria-live="polite">100%</div>
    <div id="hint"></div>

    <!-- floating actions for the current selection -->
    <div id="selBar">
      <button id="selCopy" class="sq-btn" data-icon="copy" title="Duplicate"></button>
      <button id="selDelete" class="sq-btn" data-icon="trash" title="Delete"></button>
    </div>

    <!-- option dialog for the active tool -->
    <div id="popover" class="popover"></div>

    <!-- board bar (undo / redo / boards) -->
    <div id="boardBar" class="bar">
      <button id="undoBtn" class="sq-btn" data-icon="undo" title="Undo"></button>
      <button id="redoBtn" class="sq-btn" data-icon="redo" title="Redo"></button>
      <span class="divider"></span>
      <button id="prevBoard" class="sq-btn" data-icon="chevL" title="Previous board"></button>
      <div id="boardLabel" class="board-label">Board 1 of 1</div>
      <button id="nextBoard" class="sq-btn" data-icon="chevR" title="Next board"></button>
      <button id="addBoard" class="sq-btn" data-icon="plus" title="New board"></button>
      <button id="delBoard" class="sq-btn" data-icon="trash" title="Delete board"></button>
    </div>

    <!-- tool bar -->
    <div id="toolBar" class="bar">
      <button class="tool-btn" data-tool="select"><span data-icon="select"></span><span>Select</span></button>
      <button class="tool-btn" data-tool="move"><span data-icon="move"></span><span>Move</span></button>
      <button class="tool-btn active" data-tool="pen"><span data-icon="pen"></span><span>Pen</span></button>
      <button class="tool-btn" data-tool="eraser"><span data-icon="eraser"></span><span>Eraser</span></button>
      <button class="tool-btn" data-tool="shapes"><span data-icon="shapes"></span><span>Shapes</span></button>
      <button class="tool-btn" data-tool="tools"><span data-icon="wrench"></span><span>Tools</span></button>
      <button class="tool-btn" data-tool="clear"><span data-icon="broom"></span><span>Clear</span></button>
      <button class="tool-btn" data-tool="text"><span data-icon="text"></span><span>Text</span></button>
      <button class="tool-btn" data-tool="backdrop"><span data-icon="backdrop"></span><span>Backdrop</span></button>
    </div>
  </main>

  <!-- ===================== GRAPH WORKSPACE (phase 2) ===================== -->
  <main id="ws-graph" class="workspace">
    <button class="float-btn" data-open-sidebar data-icon="panel" title="Menu" aria-label="Open menu"></button>
    <div class="placeholder">
      <h2>Graph Calculator</h2>
      <p>Coming in phase 2.</p>
    </div>
  </main>

  <!-- generic confirmation dialog (used by Clear, Delete board …) -->
  <div id="modal"></div>

  <!-- scripts: order matters -->
  <script src="js/icons.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/geometry.js"></script>
  <script src="js/whiteboard.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
